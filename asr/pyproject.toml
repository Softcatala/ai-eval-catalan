[project]
name = "asr-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "torchaudio",
    "datasets<3.0",
    "soundfile",
    "librosa",
    "jiwer",
    "tqdm",
    "transformers",
    "pillow>=12.2.0",
    "torchvision>=0.19.0",
    "accelerate>=1.13.0",
    "openai",
    "google-genai",
]

[dependency-groups]
vibe = ["vibevoice"]

[tool.uv]
# omnilingual_asr is a local/private package not available on PyPI.
# Install it separately before running: uv pip install -e /path/to/omnilingual_asr

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
vibevoice = { path = "VibeVoice", editable = true }
