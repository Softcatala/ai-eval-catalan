name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Check formatting
        run: make format-check

      - name: Check publish scripts
        run: make publish-check

      - name: Run unit tests
        run: make unit-test

      - name: Run data validation
        run: make data-validation
