name: Publish llms.json

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate llms.json
        working-directory: llm
        run: python summarize_results.py --json-norm llms.json

      - name: Generate asrs.json
        working-directory: asr
        run: python summarize_results.py --json-out asrs.json

      - name: Generate embeddings.json
        working-directory: embeddings
        run: python summarize_results.py --json-out embeddings.json

      - name: Generate table and bar chart HTML
        run: |
          python render_tables.py
          python render_bar_charts.py

      - name: Checkout prod-data branch
        uses: actions/checkout@v4
        with:
          ref: prod-data
          path: prod_data_branch

      - name: Copy files to prod-data
        run: |
          cp llm/llms.json prod_data_branch/llms.json
          cp llm/llms_table.html prod_data_branch/llms_table.html
          cp llm/llms_quantized_table.html prod_data_branch/llms_quantized_table.html
          cp llm/llms_bar.html prod_data_branch/llms_bar.html
          cp asr/asrs.json prod_data_branch/asrs.json
          cp asr/asrs_table.html prod_data_branch/asrs_table.html
          cp asr/asrs_bar.html prod_data_branch/asrs_bar.html
          cp embeddings/embeddings.json prod_data_branch/embeddings.json
          cp embeddings/embeddings_table.html prod_data_branch/embeddings_table.html
          cp embeddings/embeddings_bar.html prod_data_branch/embeddings_bar.html

      - name: Commit and push to prod-data
        working-directory: prod_data_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.json llms_table.html llms_quantized_table.html llms_bar.html asrs.json asrs_table.html asrs_bar.html embeddings.json embeddings_table.html embeddings_bar.html
          git diff --cached --quiet || git commit -m "Update llms.json, llms_table.html, llms_quantized_table.html, llms_bar.html, asrs.json, asrs_table.html, asrs_bar.html, embeddings.json, embeddings_table.html, embeddings_bar.html from ${{ github.ref_name }}@${{ github.sha }}"
          git push
