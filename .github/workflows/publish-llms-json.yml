name: Publish evaluation JSON

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate llms.json
        run: python -m llm.summarize_results --json-norm llm/llms.json

      - name: Generate asrs.json
        run: python -m asr.summarize_results --json-out asr/asrs.json

      - name: Generate embeddings.json
        run: python -m embeddings.summarize_results --json-out embeddings/embeddings.json

      - name: Checkout prod-data branch
        uses: actions/checkout@v4
        with:
          ref: prod-data
          path: prod_data_branch

      - name: Copy JSON files to prod-data
        run: |
          cp llm/llms.json prod_data_branch/llms.json
          cp llm/llms_quantized.json prod_data_branch/llms_quantized.json
          cp asr/asrs.json prod_data_branch/asrs.json
          cp embeddings/embeddings.json prod_data_branch/embeddings.json

      - name: Commit and push to prod-data
        working-directory: prod_data_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.json llms_quantized.json asrs.json embeddings.json
          git diff --cached --quiet || git commit -m "Update evaluation JSON from ${{ github.ref_name }}@${{ github.sha }}"
          git push
