[project]
name = "model-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "datasets>=2.16.0,<3.0.0",
    "transformers",
    "scikit-learn",
    "unbabel-comet>=2.2.0",
    "lm-eval[api]",
    "google-generativeai",
    "accelerate",
    "openai>=2.31.0",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
    "spacy>=3.8.14",
    "ca-core-news-sm",
    "es-core-news-sm",
    "xx-sent-ud-sm",
    "iso639-lang>=2.6.3",
    "mantinc-catalan-drift",
]

[project.scripts]
model-eval = "model:main"

[tool.ruff.lint]
# E402: imports after env-var setup in model.py are intentional (must run before datasets loads)
ignore = ["E402"]

[tool.uv.sources]
mantinc-catalan-drift = { git = "https://github.com/Softcatala/mantinc-catalan-drift.git", tag = "v1.0.0" }
ca-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ca_core_news_sm-3.8.0/ca_core_news_sm-3.8.0-py3-none-any.whl" }
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
xx-sent-ud-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.9",
]
